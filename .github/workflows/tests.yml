name: Tests

# Runs the real test suite on every push and PR to this branch - 61 tests
# existed only to be run manually before this; a regression could ship
# without anyone noticing it broke something already covered.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-deploy.txt

      - name: Install tesseract (system binary, not just the Python wrapper)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Compile-check every tracked Python file
        run: |
          git ls-tree -r -z HEAD --name-only | grep -z '\.py$' | \
            xargs -0 -I{} python3 -m py_compile "{}"

      - name: Run test suite
        run: python3 -m pytest tests/ -v

      - name: Pre-flight check (dummy credentials - import/config validation only)
        env:
          ALPACA_API_KEY: test_key
          ALPACA_SECRET_KEY: test_secret
          PATREON_ACCESS_TOKEN: test_token
          TRADE_MODE: dry
        run: python3 system_boot.py
